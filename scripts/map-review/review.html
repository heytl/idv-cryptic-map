<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>磷光症 · 噩梦地图审核</title>
<style>
:root{color-scheme:light;--ink:#183342;--muted:#536b78;--line:#c9d6dd;--paper:#f3f6f8;--blue:#1267a0;--b1:#007d89;--b2:#a45409;--b3:#9a4582;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button,a,input,select,textarea{outline-offset:3px}button{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 12px;border-radius:5px}button:hover{border-color:var(--blue)}button.active,button.primary{background:var(--blue);border-color:var(--blue);color:white}button:disabled{opacity:.5;cursor:default}input,textarea,select{border:1px solid #a9bac4;border-radius:4px;background:white;color:var(--ink);padding:7px}header{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);min-height:72px;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:22px;letter-spacing:.04em}header small{font-size:13px;font-weight:400;color:var(--muted);margin-left:14px}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.shell{display:grid;grid-template-columns:224px minmax(0,1fr)}aside{background:white;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.search{width:100%;margin-bottom:18px}.group{margin-bottom:20px}.group h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 8px 7px}.layout-link{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;display:flex;justify-content:space-between}.layout-link.active{background:#e3eff7;color:#124e75;font-weight:600}.dot{color:var(--muted)}.dot.done{color:#0d774e}main{padding:24px 28px;min-width:0}.map-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h2{font-size:25px;margin:0 0 5px}.category{font-size:14px;color:var(--muted)}.tabs{display:flex;gap:5px;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:minmax(280px,1fr) 320px;gap:22px;align-items:start}.preview{background:#dce4e9;border:1px solid var(--line);padding:18px;min-width:0}.preview canvas{display:block;width:100%;height:auto;background:#19232b;max-width:1000px;margin:auto}.image-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:13px}.image-tools label{display:flex;align-items:center;gap:5px}.editor{background:white;border:1px solid var(--line);padding:18px;position:sticky;top:95px}.editor h3{font-size:16px;margin:0 0 16px}.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range label{font-size:12px;color:var(--muted)}.range input{display:block;width:100%;margin-top:5px}.error{color:#a42835;font-size:13px;line-height:1.6;margin-top:10px}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:12px 0}.metric{font-variant-numeric:tabular-nums;font-size:13px;line-height:1.8;margin:14px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric div{display:flex;justify-content:space-between;gap:6px}.status{display:flex;align-items:center;gap:7px;font-size:14px;margin:16px 0 10px}.note{width:100%;height:70px;resize:vertical}.editor button{margin-top:10px}.source-summary{margin-top:20px}.source-summary summary{cursor:pointer;font-size:14px}.source-stage{position:relative;margin:12px auto 0;max-width:480px}.source-stage img{width:100%;display:block}.marker{position:absolute;left:0;width:100%;border-top:2px solid var(--blue);border-bottom:2px solid var(--blue);pointer-events:none}.marker span{background:var(--blue);color:white;font-size:11px;padding:2px 5px;position:absolute;right:0;top:0}.marker.b1{border-color:var(--b1)}.marker.b1 span{background:var(--b1)}.marker.b2{border-color:var(--b2)}.marker.b2 span{background:var(--b2)}.marker.b3{border-color:var(--b3)}.marker.b3 span{background:var(--b3)}details.table-panel{margin-top:20px;background:white;border:1px solid var(--line);padding:16px;overflow:auto}summary{cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}a{color:var(--blue)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#183342;color:white;padding:12px 20px;border-radius:6px;z-index:10}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:6px;width:min(96vw,1250px);max-height:94vh;padding:16px}dialog::backdrop{background:#132732bc}dialog canvas{display:block;width:100%;height:auto;margin-top:12px}dialog .zoom-area{overflow:auto;max-height:80vh}dialog .actual{width:auto;max-width:none}footer{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.7}#load-error{padding:25px;color:#a42835}.mobile-select{display:none}
@media(min-width:1550px){.workspace{grid-template-columns:minmax(400px,850px) 340px}main{max-width:1300px}}@media(max-width:1100px){.shell{grid-template-columns:180px 1fr}.workspace{grid-template-columns:1fr}.editor{position:static}.range{grid-template-columns:repeat(4,1fr)}.preview{padding:10px}main{padding:20px}.map-title{align-items:start;flex-direction:column}}@media(max-width:650px){header{padding:12px;position:static;align-items:start;flex-direction:column}h1{font-size:20px}header small{display:block;margin:5px 0 0}.shell{display:block}aside{display:none}.mobile-select{display:block;width:100%;margin-bottom:18px}main{padding:14px}.range{grid-template-columns:1fr 1fr}.tabs button{padding:8px 10px}.image-tools{flex-wrap:wrap}.preview{padding:7px}.map-title{margin-bottom:14px}.actions button{font-size:13px}}
[hidden]{display:none!important}
</style>
<header><h1>磷光症 <small>噩梦地图审核</small></h1><div class="actions"><span id="progress"></span><button id="download" class="primary">导出坐标 JSON</button><button id="csv">导出 CSV</button></div></header>
<div class="shell"><aside><input class="search" id="search" type="search" placeholder="查找地图或分类" aria-label="查找地图或分类"><nav id="nav"></nav></aside>
<main><select class="mobile-select" id="mobile-map" aria-label="选择地图"></select><div class="map-title"><div><h2 id="name"></h2><div id="category" class="category"></div></div><div id="tabs" class="tabs" role="group" aria-label="预览区域"></div></div>
<div class="workspace"><section class="preview" aria-label="地图预览"><div class="image-tools"><span id="dimensions"></span><div class="actions"><label><input id="overlay" type="checkbox" checked>楼层边界</label><button id="zoom">放大查看</button></div></div><canvas id="preview" aria-label="当前区域图片"></canvas><details class="source-summary" id="original"><summary>原图与坐标边界</summary><div id="source-stage" class="source-stage"></div></details></section>
<section class="editor" aria-label="区域坐标编辑"><h3 id="region-title"></h3><div id="inputs" class="range"></div><div id="error" class="error" role="alert"></div><div id="metrics" class="metric"></div><p class="hint">坐标使用原图像素，结束 Y 不含该行。全图和楼层固定全宽，楼层可重叠。</p><div id="overlap" class="hint"></div><button id="reset">还原本图识别坐标</button><label class="status"><input id="approved" type="checkbox">本图已审核</label><textarea id="note" class="note" placeholder="审核备注" aria-label="审核备注"></textarea><p id="save-state" class="hint"></p></section></div>
<details class="table-panel"><summary>全部布局坐标</summary><table><thead><tr><th>入口分类</th><th>地图</th><th>区域</th><th>原图 Y</th><th>全图相对 Y</th><th>尺寸</th><th>审核</th></tr></thead><tbody id="coordinate-table"></tbody></table></details>
<footer>离线审核预览。修改保存在当前浏览器，可导出 JSON 留存。修改坐标后，须按导出 JSON 重新生成资源，再匹配正式配置中的地图、难度、入口及楼层标识。此页不会连接正式环境。</footer></main></div>
<dialog id="zoom-dialog"><div class="actions"><button id="close-zoom">关闭</button><button id="actual-size">原始像素 / 适应宽度</button></div><div class="zoom-area"><canvas id="zoom-canvas"></canvas></div></dialog><div class="toast" id="toast" role="status"></div>
<dialog id="export-dialog"><h3>导出坐标 JSON</h3><textarea id="export-text" aria-label="导出 JSON 内容" readonly style="width:100%;height:55vh;font-family:monospace;font-size:12px"></textarea><div class="actions"><button id="save-json" class="primary">下载 JSON 文件</button><button id="copy-json">复制 JSON</button><button id="close-export">关闭</button></div></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent),base=structuredClone(data.manifest);
let manifest=structuredClone(base),current=manifest.layouts[0].id,region='full',image=null,loadNumber=0,timer,saveAvailable=true;
const $=id=>document.getElementById(id),labels={full:'全图',entrance:'入口',b1:'-1 层',b2:'-2 层',b3:'-3 层'},colors={b1:'#00becb',b2:'#ffc16a',b3:'#ed93cf'},storageKey='map-review:'+base.bundleId;
const item=()=>manifest.layouts.find(x=>x.id===current),rectFor=(i,key)=>key in i.floors?i.floors[key]:i[key],end=r=>r.y+r.height;
function valid(i){for(const [k,r] of [['full',i.full],['entrance',i.entrance],...Object.entries(i.floors)]){if(!['x','y','width','height'].every(k=>Number.isSafeInteger(r[k]))||r.x<0||r.y<0||r.width<1||r.height<1||r.x+r.width>i.source.width||end(r)>i.source.height)return '坐标须为原图范围内的整数，且区域尺寸须大于零。';if(k!=='entrance'&&(r.x!==0||r.width!==i.source.width))return '全图和楼层须保持全宽。';if(k in i.floors&&(r.y<i.full.y||end(r)>end(i.full)))return '楼层超出全图范围，请先扩大全图。';}return '';}
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.bundleId===base.bundleId&&saved.layouts.length===base.layouts.length&&saved.layouts.every((i,n)=>i.id===base.layouts[n].id&&i.source.sha256===base.layouts[n].source.sha256&&!valid(i)))manifest=saved;}catch{saveAvailable=false;}
function toast(s){$('toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',2800);}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(manifest));saveAvailable=true;}catch{saveAvailable=false;}$('save-state').textContent=saveAvailable?'已保存在此浏览器。':'浏览器无法保存，请导出 JSON 留存。';$('progress').textContent=manifest.layouts.filter(i=>i.review.status==='approved').length+' / '+manifest.layouts.length+' 已审核';}
function button(text,fn,active=false){const b=document.createElement('button');b.textContent=text;b.className=active?'active':'';b.onclick=fn;return b;}
function nav(){const query=$('search').value.trim();$('nav').replaceChildren();$('mobile-map').replaceChildren();for(const category of [...new Set(manifest.layouts.map(i=>i.category))]){const group=document.createElement('section');group.className='group';const title=document.createElement('h2');title.textContent=category;group.append(title);for(const i of manifest.layouts.filter(i=>i.category===category)){const option=document.createElement('option');option.value=i.id;option.textContent=category+' / '+i.name;option.selected=i.id===current;$('mobile-map').append(option);if(query&&!`${i.name} ${category}`.includes(query))continue;const b=button('',()=>select(i.id),i.id===current);b.classList.add('layout-link');const name=document.createElement('span');name.textContent=i.name;const state=document.createElement('span');state.className='dot'+(i.review.status==='approved'?' done':'');state.textContent=i.review.status==='approved'?'✓':'○';state.setAttribute('aria-label',i.review.status==='approved'?'已审核':'待审核');b.append(name,state);group.append(b);}if(group.children.length>1)$('nav').append(group);}}
async function select(id){current=id;const i=item();const seq=++loadNumber;image=null;const ctx=$('preview').getContext('2d');ctx.clearRect(0,0,$('preview').width,$('preview').height);$('name').textContent=i.name;$('category').textContent=i.category;nav();renderControls();const img=new Image();img.onload=()=>{if(seq!==loadNumber)return;image=img;draw();sourceStage();};img.onerror=()=>toast('原图加载失败，请重新打开完整 HTML 文件。');img.src=data.sources[id];}
function renderControls(){$('error').textContent='';const i=item(),r=rectFor(i,region);$('tabs').replaceChildren(...Object.keys(labels).map(k=>button(labels[k],()=>{region=k;renderControls();draw();},region===k)));$('region-title').textContent=labels[region]+'坐标';$('overlay').parentElement.hidden=region!=='full';$('inputs').replaceChildren();const fields=[['y','开始 Y',r.y],['bottom','结束 Y',end(r)]];if(region==='entrance')fields.push(['x','开始 X',r.x],['right','结束 X',r.x+r.width]);for(const [key,label,value] of fields){const wrap=document.createElement('label');wrap.textContent=label;const input=document.createElement('input');input.type='number';input.step='1';input.min='0';input.max=String(['x','right'].includes(key)?i.source.width:i.source.height);input.value=value;input.setAttribute('aria-label',label);input.dataset.field=key;input.onchange=()=>edit(key,input.valueAsNumber,input);wrap.append(input);$('inputs').append(wrap);}$('approved').checked=i.review.status==='approved';$('note').value=i.review.note;metrics();persist();}
function edit(key,value,input){const i=item(),r=rectFor(i,region),next=structuredClone(r);if(key==='bottom')next.height=value-next.y;else if(key==='right')next.width=value-next.x;else if(key==='y'){next.height=end(r)-value;next.y=value;}else if(key==='x'){next.width=r.x+r.width-value;next.x=value;}const candidate=structuredClone(i);if(region in candidate.floors)candidate.floors[region]=next;else candidate[region]=next;const error=valid(candidate);$('error').textContent=error;if(error){input.value=key==='bottom'?end(r):key==='right'?r.x+r.width:r[key];return;}Object.assign(r,next);i.review.status='pending';$('approved').checked=false;persist();metrics();draw();sourceStage();nav();table();}
function metrics(){const i=item(),r=rectFor(i,region);$('dimensions').textContent=`${r.width} × ${r.height} px`;$('metrics').replaceChildren();const rows=[['原图区域',`X ${r.x} · Y ${r.y}–${end(r)}`],['尺寸',`${r.width} × ${r.height}`]];if(region in i.floors)rows.push(['全图相对 Y',`${r.y-i.full.y}–${end(r)-i.full.y}`]);for(const [name,value] of rows){const line=document.createElement('div'),a=document.createElement('span'),b=document.createElement('span');a.textContent=name;b.textContent=value;line.append(a,b);$('metrics').append(line);}const overlaps=[];const floors=Object.keys(i.floors);for(let n=0;n<floors.length-1;n++){const a=i.floors[floors[n]],b=i.floors[floors[n+1]],px=Math.max(0,Math.min(end(a),end(b))-Math.max(a.y,b.y));if(px)overlaps.push(`${labels[floors[n]]}与${labels[floors[n+1]]}重叠 ${px}px`);}$('overlap').textContent=overlaps.join('；');}
function draw(){if(!image)return;const i=item(),r=rectFor(i,region),canvas=$('preview');canvas.width=r.width;canvas.height=r.height;const ctx=canvas.getContext('2d');ctx.drawImage(image,r.x,r.y,r.width,r.height,0,0,r.width,r.height);if(region==='full'&&$('overlay').checked){for(const [key,f] of Object.entries(i.floors)){const y=f.y-r.y;ctx.strokeStyle=colors[key];ctx.lineWidth=3;ctx.strokeRect(1,y+1,r.width-2,f.height-2);ctx.fillStyle=colors[key];ctx.fillRect(0,y,190,30);ctx.fillStyle='#132732';ctx.font='18px sans-serif';ctx.fillText(labels[key]+' '+f.y+'–'+end(f),8,y+22);}}}
function sourceStage(){if(!$('original').open||!image)return;const i=item(),stage=$('source-stage');stage.replaceChildren();const img=document.createElement('img');img.src=data.sources[i.id];img.alt=i.name+'完整原图';stage.append(img);for(const [key,r] of [['entrance',i.entrance],['full',i.full],...Object.entries(i.floors)]){const box=document.createElement('div');box.className='marker '+key;box.style.top=r.y/i.source.height*100+'%';box.style.height=r.height/i.source.height*100+'%';box.style.left=r.x/i.source.width*100+'%';box.style.width=r.width/i.source.width*100+'%';const text=document.createElement('span');text.textContent=labels[key]+' '+r.y+'–'+end(r);box.append(text);stage.append(box);}}
function table(){$('coordinate-table').replaceChildren();for(const i of manifest.layouts)for(const [key,r] of [['full',i.full],['entrance',i.entrance],...Object.entries(i.floors)]){const tr=document.createElement('tr');for(const value of [i.category,i.name,labels[key],`${r.y}–${end(r)}`,key in i.floors?`${r.y-i.full.y}–${end(r)-i.full.y}`:'—',`${r.width} × ${r.height}`,i.review.status==='approved'?'已审核':'待审核']){const td=document.createElement('td');td.textContent=value;tr.append(td);}$('coordinate-table').append(tr);}}
function snapshot(){const copy=structuredClone(manifest);copy.exportedAt=new Date().toISOString();copy.assetsRequireRebuild=false;for(const i of copy.layouts){const original=base.layouts.find(b=>b.id===i.id);const changed=JSON.stringify([i.full,i.entrance,i.floors])!==JSON.stringify([original.full,original.entrance,original.floors]);if(changed){delete i.preparedAssets;copy.assetsRequireRebuild=true;}i.floorRegions={imageWidth:i.full.width,imageHeight:i.full.height,regions:Object.fromEntries(Object.entries(i.floors).map(([k,r])=>[k,{...r,y:r.y-i.full.y}]))};}return copy;}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('download').onclick=()=>{$('export-text').value=JSON.stringify(snapshot(),null,2);$('export-dialog').showModal();};$('close-export').onclick=()=>$('export-dialog').close();$('save-json').onclick=()=>{download($('export-text').value,'application/json','phosphor-nightmare-coordinates.json');toast('已请求下载；也可复制 JSON 留存。');};$('copy-json').onclick=async()=>{try{await navigator.clipboard.writeText($('export-text').value);toast('已复制 JSON。');}catch{$('export-text').select();toast('已选中 JSON，请复制留存。');}};
$('csv').onclick=()=>{const rows=[['布局','入口分类','区域','原图X','原图Y起','原图Y止(不含)','宽','高','全图相对Y','审核状态']];for(const i of manifest.layouts)for(const [key,r] of [['full',i.full],['entrance',i.entrance],...Object.entries(i.floors)])rows.push([i.name,i.category,key,r.x,r.y,end(r),r.width,r.height,key in i.floors?r.y-i.full.y:'',i.review.status]);download('\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8','phosphor-nightmare-coordinates.csv');};
$('approved').onchange=()=>{item().review.status=$('approved').checked?'approved':'pending';persist();nav();table();};$('note').oninput=()=>{item().review.note=$('note').value;persist();};$('reset').onclick=()=>{const i=item(),b=base.layouts.find(i=>i.id===current);for(const key of ['full','entrance','floors'])i[key]=structuredClone(b[key]);i.review.status='pending';$('error').textContent='';renderControls();draw();sourceStage();nav();table();toast('已还原此图的初始坐标。');};$('search').oninput=nav;$('mobile-map').onchange=()=>select($('mobile-map').value);$('overlay').onchange=draw;$('original').ontoggle=sourceStage;
$('zoom').onclick=()=>{if(!image)return;const r=rectFor(item(),region),c=$('zoom-canvas');c.width=r.width;c.height=r.height;c.getContext('2d').drawImage(image,r.x,r.y,r.width,r.height,0,0,r.width,r.height);$('zoom-dialog').showModal();};$('close-zoom').onclick=()=>$('zoom-dialog').close();$('actual-size').onclick=()=>$('zoom-canvas').classList.toggle('actual');
table();select(current);
</script>
</html>
