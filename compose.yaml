services:
  app:
    container_name: idv-cryptic-map
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-${ADMIN_PASSWORD:?Set ADMIN_KEY in .env (at least 32 characters)}}
      TELEMETRY_WECHAT_APP_ID: ${TELEMETRY_WECHAT_APP_ID:-}
    volumes:
      - /opt/idv-map/data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
