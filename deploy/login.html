<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>登录 · 加页手记</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#eaf0fa;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center;padding:32px 20px}main{width:100%;max-width:420px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:44px;color:#b7c3d6;font-size:14px}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #3d5277;border-radius:12px;color:#a7baff;font-size:15px;font-weight:700}h1{font-size:30px;line-height:1.3;margin:0 0 12px;letter-spacing:-.5px}.intro{color:#b7c3d6;margin:0 0 32px}label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}.field{position:relative}input{width:100%;min-height:52px;padding:12px 68px 12px 14px;background:#182232;color:#eaf0fa;border:1px solid #40516a;border-radius:8px;font:inherit}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #a7baff;outline-offset:3px}input[aria-invalid=true]{border-color:#ff9f9f}.reveal{position:absolute;right:4px;top:4px;height:44px;min-width:58px;background:transparent;color:#b7c3d6;border:0;border-radius:4px;font:inherit;font-size:14px;cursor:pointer}.error{color:#ffb5b5;font-size:14px;min-height:24px;margin:10px 0 18px}.submit{width:100%;min-height:50px;background:#6b8cff;color:#091126;border:0;border-radius:8px;font:inherit;font-weight:650;cursor:pointer}.submit:hover{background:#86a0ff}.submit:disabled{opacity:.65;cursor:wait}.note{font-size:13px;color:#91a0b5;margin:18px 0 32px}a{color:#b7c3d6;text-decoration:underline;text-underline-offset:4px;font-size:14px}footer{border-top:1px solid #2d3a4f;padding-top:22px} @media(max-width:480px){.brand{margin-bottom:36px}h1{font-size:28px}}
</style><style>
.field-label{margin-top:18px}input[readonly]{color:#b7c3d6;background:#141e2c;padding-right:14px}.remember{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:#b7c3d6;cursor:pointer;font-weight:400;margin:0 0 12px;width:fit-content}.remember input{width:18px;height:18px;min-height:0;padding:0;margin:0;accent-color:#6b8cff;flex-shrink:0}.brand{margin-bottom:32px}.intro{margin-bottom:24px}
</style></head>
<body><main><div class="brand"><span class="mark" aria-hidden="true">CM</span><span>加页手记 / 内容工作台</span></div><h1>登录工作台</h1><p class="intro">输入管理密钥，继续管理地图内容。</p>
<form id="login" action="/auth/login" method="post" autocomplete="on"><label for="username">管理员账号</label><input id="username" name="username" type="text" autocomplete="username" value="admin" readonly><label class="field-label" for="password">管理密钥</label><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" aria-describedby="error note"><button class="reveal" type="button" aria-label="显示密钥" aria-pressed="false">显示</button></div><p class="error" id="error" role="alert" aria-live="polite">__ERROR__</p><label class="remember" for="remember"><input id="remember" name="remember" type="checkbox" __REMEMBER__>在此设备保持登录 30 天</label><button class="submit" type="submit">登录</button><p class="note" id="note">未勾选时登录有效期为 8 小时。可使用浏览器或 Bitwarden 保存、填充密钥。</p></form><footer><a href="/">返回地图首页</a></footer></main>
<script nonce="__NONCE__">
const form=document.querySelector('#login'),key=document.querySelector('#password'),error=document.querySelector('#error'),submit=document.querySelector('.submit'),reveal=document.querySelector('.reveal');
reveal.addEventListener('click',()=>{const show=key.type==='password';key.type=show?'text':'password';reveal.textContent=show?'隐藏':'显示';reveal.setAttribute('aria-label',show?'隐藏密钥':'显示密钥');reveal.setAttribute('aria-pressed',String(show))});
key.addEventListener('input',()=>{error.textContent='';key.removeAttribute('aria-invalid')});
// Native submission and server redirect let password managers observe a successful login.
form.addEventListener('submit',()=>{key.type='password';submit.disabled=true;submit.textContent='正在登录…'});
window.addEventListener('pageshow',()=>{submit.disabled=false;submit.textContent='登录'});
</script></body></html>
