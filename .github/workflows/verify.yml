name: Shared verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type checks
        run: pnpm check:shared && pnpm check:worker

      - name: Build
        run: pnpm build

      - name: Verify Node and SQLite service
        run: node deploy/build.mjs && node --test deploy/server.test.mjs

      - name: Verify upgrade from a cached app
        run: |
          pnpm exec wrangler deploy --dry-run --env dev --outdir .tmp/worker-build
          node scripts/verification-server.mjs &
          verification_pid=$!
          trap 'kill "$verification_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8787/maps-v4.json > /dev/null; then break; fi
            sleep 1
          done
          pnpm verify:pwa:update

  containers:
    uses: ./.github/workflows/docker.yml
