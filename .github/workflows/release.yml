name: Release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (select production in the branch selector)
        type: choice
        required: true
        options: [docker, cloudflare, both]
permissions:
  contents: read
jobs:
  select-production:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Select production in Run workflow. main only registers the release entry point.'
          exit 1
