name: Test and preview
on:
  push:
    branches: [production, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  preview:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build && pnpm --filter admin build
      - name: Configure preview D1 binding
        env:
          V3_PREVIEW_D1_ID: ${{ vars.V3_PREVIEW_D1_ID }}
        run: node scripts/configure-preview-d1.mjs

      - name: Migrate preview statistics database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: d1 migrations apply STATS --remote --env v2-preview

      - name: Deploy isolated preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy --env v2-preview
