name: Test & Deploy

# 长期分支职责：
# - feat/admin-backend：线上 Worker、后台与动态 V2 的唯一正式部署来源。
# - main：只用于静态页面版本发布，绝不由本工作流部署 Worker。
on:
  push:
    branches: [feat/admin-backend]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # PR：上传预览版本（预览 URL 见本步骤日志；需在 Cloudflare Dashboard
      # 开启该 Worker 的 Preview URLs 开关）
      - name: Upload preview version (PR)
        if: github.event_name == 'pull_request'
        continue-on-error: true # secrets 未配置时不阻塞 CI（测试与构建仍是硬门槛）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      # 仅 Worker 正式分支部署生产；main 的静态页面走独立发布渠道。
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/admin-backend'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
